name: Release
on: { push: { tags: ["v*"] } }
permissions: { contents: write }
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./...
      - run: go run ./tools/build
      # The optional sync server (cmd/arc-server, M7) is cross-compiled here once it exists.
      - name: Build server binaries (M7)
        shell: bash
        run: |
          if [ -d cmd/arc-server ]; then
            for t in windows/amd64 darwin/arm64 linux/amd64; do
              GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags="-s -w" -o "out/arc-server-${t%/*}-${t#*/}$([ ${t%/*} = windows ] && echo .exe)" ./cmd/arc-server
            done
          fi
          (cd dist && zip -qr ../arc-site.zip .)
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" arc-site.zip $(ls out/* 2>/dev/null) --generate-notes
