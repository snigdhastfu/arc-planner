<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__APP_NAME__</title>
<meta name="description" content="__APP_DESC__">
<meta name="theme-color" content="__THEME__">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="__APP_SHORT__">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="preload" href="fonts/Fredoka-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Fredoka-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body data-logo="__LOGO__">
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- One shared "line boil" filter; its seed is stepped at ~5 fps by js/anim.js. -->
    <filter id="boil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence id="boil-noise" type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="1.3"/>
    </filter>
  </defs>
</svg>
<div id="boot" class="boot" role="status" aria-label="Loading __APP_NAME__">
  <div class="boot-doodle">__MARK_INLINE__</div>
  <p class="boot-line">Sharpening pencils…</p>
</div>
<div id="app" class="app" hidden>
  <div id="banner-slot" class="banner-slot"></div>
  <main id="screen" class="screen" tabindex="-1"></main>
  <nav id="nav" class="nav" aria-label="Main"></nav>
</div>
<div id="layer" class="layer"></div>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<noscript><p style="color:#F0EFEF;font-family:sans-serif;padding:24px">__APP_NAME__ needs JavaScript to run.</p></noscript>
<script>
(() => {
  let finished = false;
  const line = document.querySelector('.boot-line');
  const report = (label, error) => {
    if (finished || !line) return;
    const details = error && (error.stack || error.message) || String(error);
    line.textContent = `${label}\n${details}`;
    line.classList.add('boot-error');
  };
  window.__arcBootSetStage = (stage) => {
    if (!finished) window.__arcBootStage = stage;
  };
  window.__arcBootReportError = report;
  window.__arcBootFinish = () => {
    finished = true;
    clearTimeout(window.__arcBootTimeout);
  };
  window.onerror = (message, source, row, column, error) => {
    report('Boot error', error || `${message}\n${source || ''}:${row || 0}:${column || 0}`);
    return false;
  };
  window.onunhandledrejection = (event) => report('Unhandled promise rejection', event.reason);
  window.__arcBootSetStage('loading wasm_exec.js');
  window.__arcBootTimeout = setTimeout(() => {
    const error = new Error(`Boot timed out after 10 seconds while ${window.__arcBootStage || 'starting'}.`);
    report('Boot timeout', error);
  }, 10000);
})();
</script>
<script src="wasm_exec.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
